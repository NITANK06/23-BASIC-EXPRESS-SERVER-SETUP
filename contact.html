<!DOCTYPE html>
<html>
<head>
  <title>Contact</title>
</head>
<body>
  <h1>Contact Page</h1>

  <form method="POST" action="/contact">
    <input type="text" name="name" placeholder="Name" />
    <br /><br />

    <input type="email" name="email" placeholder="Email" />
    <br /><br />

    <textarea name="message" placeholder="Message"></textarea>
    <br /><br />

    <button type="submit">Send</button>
  </form>
</body>
</html>
